[package]
name = "holamundo"
version = "1.0.0"
edition = "2021"
description = "App Hola Mundo para Windows 11 en Rust"

[dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
winreg = "0.52"

[build-dependencies]
winres = "0.1.12"

[[bin]]
name = "holamundo"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
